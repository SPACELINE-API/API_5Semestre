[tool.mypy]
mypy_path = "."
explicit_package_bases = true
exclude = "(^|/)tests/"

[[tool.mypy.overrides]]
module = "pact.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
python_files = ["*.test.py"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
  ".venv",
  "__pycache__",
  ".pytest_cache",
  "migrations"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "B",
  "UP"
]
ignore = [
  "E501",
  "B008"
]
