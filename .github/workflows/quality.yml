name: CI

on:
  pull_request:
    branches:
      - develop

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check formatting
        run: pnpm format:check

      - name: Lint web
        run: pnpm --filter @api/web lint

      - name: Typecheck web
        run: pnpm --filter @api/web check:types

  server:
    name: Server quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/server/requirements.txt

      - name: Install dependencies
        working-directory: apps/server
        run: python -m pip install -r requirements.txt

      - name: Check server formatting
        working-directory: apps/server
        run: ruff format --check .

      - name: Lint server
        working-directory: apps/server
        run: ruff check .

      - name: Run server tests
        working-directory: apps/server
        run: |
          if find . -type f \( -name 'test_*.py' -o -name '*_test.py' \) | grep -q .; then
            pytest
          else
            echo "No server tests found; skipping pytest."
          fi

      - name: Start Docker services
        run: docker compose up -d

      - name: Check Docker services
        run: docker compose ps

      - name: Check Postgres health
        run: |
          for i in {1..10}; do
            docker exec postgresql pg_isready -U postgres -d api_5semestre && exit 0
            sleep 3
          done

          docker logs postgresql
          exit 1

      - name: Stop Docker services
        if: always()
        run: docker compose down -v
