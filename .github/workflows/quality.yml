name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Valida commit messages, formatação, lint e tipos antes de rodar o resto do pipeline
  guard:
    name: Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate commit messages
        uses: wagoid/commitlint-github-action@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/server/requirements.txt

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Python dependencies
        working-directory: apps/server
        run: python -m pip install --pre --no-deps -r requirements.txt

      - name: Check formatting
        run: pnpm --filter mobile format:check

      - name: Lint server
        working-directory: apps/server
        run: ruff check .

      - name: Check server formatting
        working-directory: apps/server
        run: ruff format --check .

      - name: Typecheck server
        working-directory: apps/server
        run: |
          python -m pip install mypy
          mypy .

  # Testa o backend, valida a integração com o Postgres e gera a cobertura
  backend:
    name: Backend quality
    needs: guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/server/requirements.txt

      - name: Install dependencies
        working-directory: apps/server
        run: |
          python -m pip install --pre --no-deps -r requirements.txt
          python -m pip install pytest-cov

      - name: Start Docker services
        run: docker compose up -d spaceline-db

      - name: Check Postgres health
        run: |
          for i in {1..10}; do
            docker exec spaceline-db pg_isready -U postgres -d postgres && exit 0
            sleep 3
          done

          docker logs spaceline-db
          exit 1

      - name: Run server tests
        working-directory: apps/server
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
        run: |
          if find . -type f \( -name 'test_*.py' -o -name '*_test.py' \) | grep -q .; then
            pytest --cov --cov-report=xml
          else
            echo "No server tests found; skipping pytest."
          fi

      - name: Stop Docker services
        if: always()
        run: docker compose down -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/server/coverage.xml
          if-no-files-found: ignore

  # Valida o app mobile com TypeScript, formatação e configuração do Expo
  mobile:
    name: Mobile quality
    needs: guard
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run mobile tests
        working-directory: apps/mobile
        env:
          PLAYWRIGHT_WORKERS: 1
        run: pnpm test -- --shard=${{ matrix.shard }}/4

      - name: Upload Playwright shard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-blob-${{ matrix.shard }}
          path: apps/mobile/blob-report
          if-no-files-found: ignore

      - name: Typecheck mobile
        run: pnpm --filter mobile exec tsc --noEmit

      - name: Lint mobile
        run: pnpm --filter mobile lint

      - name: Validate Expo configuration
        working-directory: apps/mobile
        run: pnpm exec expo config --json > /dev/null

  mobile-report:
    name: Mobile report
    needs: mobile
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download Playwright shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-blob-*
          path: apps/mobile/blob-reports

      - name: Prepare Playwright shard reports
        working-directory: apps/mobile
        run: |
          mkdir -p merged-blob-reports
          for report in blob-reports/*/report.zip; do
            shard=$(basename "$(dirname "$report")")
            cp "$report" "merged-blob-reports/${shard}.zip"
          done

      - name: Merge Playwright reports
        working-directory: apps/mobile
        run: pnpm exec playwright merge-reports --reporter html merged-blob-reports

      - name: Upload merged Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/mobile/playwright-report
          if-no-files-found: ignore

  # Publica o relatório de cobertura de código gerado no job backend
  code-coverage:
    name: Code coverage
    needs: backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: apps/server

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          working-directory: apps/server

  ci-success:
    name: CI success
    needs: [guard, backend, mobile, mobile-report, code-coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "Algum job falhou ou foi cancelado"
            exit 1
          fi
      - name: Fail when a required job is skipped
        if: contains(needs.*.result, 'skipped')
        run: |
          echo "Algum job obrigatório foi ignorado"
          exit 1
